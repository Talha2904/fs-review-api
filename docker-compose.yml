# Local development services for the FS Review api.
#   docker compose up -d          postgres + minio
#   docker compose --profile portability up -d   also mysql, for the portability gate (plan section 11.3)
# Credentials match api/.env.example. Never use them outside a developer machine.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsreview
      POSTGRES_PASSWORD: fsreview
      POSTGRES_DB: fsreview
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fsreview -d fsreview']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: fsreview
      MINIO_ROOT_PASSWORD: fsreview-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once minio is up.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fsreview fsreview-secret &&
      mc mb --ignore-existing local/fs-review &&
      echo bucket ready"

  mysql:
    profiles: ['portability']
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: fsreview
      MYSQL_DATABASE: fsreview
      MYSQL_USER: fsreview
      MYSQL_PASSWORD: fsreview
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-pfsreview']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
  mysqldata:
